<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gate Inward</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<style>
  :root{--paper:#EEF0F2;--panel:#fff;--ink:#151A1F;--muted:#606B76;--line:#D3D8DD;
        --steel:#1F4E79;--amber:#C97A00;--amber-soft:#FFF3DC;--bad:#B3261E;--bad-soft:#FBE6E4}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:400 16px/1.5 Arial,Helvetica,sans-serif;padding-bottom:40px}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px}
  header{background:var(--steel);color:#fff;padding:13px 0 0}
  .brand{max-width:560px;margin:0 auto;padding:0 14px 11px;font-size:19px;font-weight:700}
  nav{display:flex;max-width:560px;margin:0 auto;padding:0 14px;gap:2px}
  nav button{flex:1;background:rgba(255,255,255,.15);border:0;color:#fff;
             font:700 14px Arial;padding:11px 4px;border-radius:7px 7px 0 0;opacity:.7}
  nav button.on{background:var(--paper);color:var(--ink);opacity:1}
  section{display:none} section.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
  h2{font-size:17px;margin:0 0 3px} .sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  label{display:block;font-size:13.5px;font-weight:700;margin:12px 0 5px;color:var(--muted)}
  input,select{width:100%;padding:12px 11px;font:16px Arial;background:var(--paper);
               color:var(--ink);border:1.5px solid var(--line);border-radius:7px}
  input:focus,select:focus{outline:none;border-color:var(--steel)}
  .btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:8px;
       font:700 16px Arial;background:var(--steel);color:#fff}
  .btn.amber{background:var(--amber)}
  .btn.ghost{background:transparent;color:var(--steel);border:1.5px solid var(--line)}
  .btn[disabled]{opacity:.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .slip{text-align:center;padding:20px 16px;border:2px dashed var(--amber);
        background:var(--amber-soft);border-radius:10px;margin-top:14px}
  .slip canvas{width:176px;height:176px;background:#fff;padding:9px;border-radius:6px}
  .grn{font:700 25px "Courier New",monospace;margin:11px 0 2px}
  .meta{font-size:13px;color:var(--muted);line-height:1.6}
  #reader{border-radius:10px;overflow:hidden;background:#000;margin-top:12px}
  #reader video{width:100%!important;display:block}
  .note{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.55}
  .warn{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:7px;
        font-size:13.5px;font-weight:700;margin-top:12px}
  .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .item .nm{flex:1;min-width:0} .item .q{width:94px;flex:none}
  .item .q input{text-align:right;padding:9px 8px;font-weight:700}
  .item small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);
         color:#fff;padding:12px 18px;border-radius:8px;font:700 14px Arial;z-index:99;
         max-width:90vw;text-align:center}
</style>
</head>
<body>

<header>
  <div class="brand">Gate Inward</div>
  <nav>
    <button id="b-gate" class="on" onclick="tab('gate')">1 · Gate</button>
    <button id="b-store" onclick="tab('store')">2 · Store</button>
  </nav>
</header>

<div class="wrap">

<section id="gate" class="on">
  <div class="card">
    <h2>Log a vehicle at the gate</h2>
    <p class="sub">Four fields. Quantities come from the store count.</p>
    <label>Supplier</label><select id="sup"><option>Loading…</option></select>
    <label>Invoice number</label><input id="inv" autocomplete="off" placeholder="26-27/151">
    <div class="row2">
      <div><label>Vehicle</label><input id="veh" autocomplete="off" placeholder="HR55 AB 1234"></div>
      <div><label>Packages</label><input id="pkg" inputmode="numeric" placeholder="0"></div>
    </div>
    <button class="btn" id="gbtn" onclick="makeGrn()">Create GRN</button>
  </div>
  <div class="card" id="slipcard" style="display:none">
    <h2>Paste this on the material</h2>
    <p class="sub">Store scans it instead of typing.</p>
    <div class="slip">
      <canvas id="qr"></canvas>
      <div class="grn" id="grntxt"></div>
      <div class="meta" id="grnmeta"></div>
    </div>
    <div id="dupwarn"></div>
    <button class="btn ghost" onclick="window.print()">Print slip</button>
  </div>
</section>

<section id="store">
  <div class="card">
    <h2>Scan the GRN slip</h2>
    <p class="sub">Live camera. No photo is taken or stored.</p>
    <button class="btn amber" id="cbtn" onclick="toggleCam()">Start camera</button>
    <div id="reader"></div>
    <p class="note" id="cnote">Tap start, then allow camera when the browser asks.</p>
    <button class="btn ghost" onclick="byHand()">Enter GRN by hand</button>
  </div>
  <div class="card" id="cnt" style="display:none">
    <h2 id="chead"></h2><p class="sub" id="csub"></p>
    <div id="items"></div>
    <button class="btn ghost" onclick="addLine()">Add another item</button>
    <button class="btn" id="sbtn" onclick="saveCount()">Save counted stock</button>
  </div>
</section>

</div>

<script>
/* ========= PASTE YOUR APPS SCRIPT /exec URL HERE ========= */
var API = "PASTE_YOUR_EXEC_URL_HERE";
/* ========================================================= */

var ITEMS = [], CUR = null, qr = null, run = false;

/* text/plain keeps this a "simple request" so no CORS preflight is sent */
function call(payload){
  return fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(r){ return r.json(); });
}

call({action:"masters"}).then(function(m){
  ITEMS = m.items || [];
  var s = document.getElementById("sup");
  s.innerHTML = (m.suppliers && m.suppliers.length)
    ? m.suppliers.map(function(x){return "<option>"+x+"</option>"}).join("")
    : "<option>No suppliers found in Sup. M.</option>";
}).catch(function(e){ toast("Cannot reach the sheet: "+e.message); });

function tab(n){
  ["gate","store"].forEach(function(x){
    document.getElementById(x).className = x===n ? "on" : "";
    document.getElementById("b-"+x).className = x===n ? "on" : "";
  });
  if(n!=="store") stopCam();
}
var tm;
function toast(m){
  clearTimeout(tm);
  var t=document.querySelector(".toast");
  if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}
  t.textContent=m; tm=setTimeout(function(){t.remove()},3000);
}

/* ---- gate ---- */
function makeGrn(){
  var inv=document.getElementById("inv").value.trim();
  if(!inv){toast("Invoice number is needed");return;}
  var b=document.getElementById("gbtn"); b.disabled=true; b.textContent="Creating…";
  var d={ supplier:document.getElementById("sup").value, invoice:inv,
          vehicle:document.getElementById("veh").value.trim()||"-",
          packages:document.getElementById("pkg").value||"0", by:"gate" };
  call({action:"create",data:d}).then(function(r){
    b.disabled=false; b.textContent="Create GRN";
    if(r.error){toast(r.error);return;}
    new QRious({element:document.getElementById("qr"),value:r.grn,size:340,level:"M"});
    document.getElementById("grntxt").textContent=r.grn;
    document.getElementById("grnmeta").innerHTML =
      d.supplier+" &middot; inv "+d.invoice+"<br>"+d.vehicle+" &middot; "+d.packages+" packages";
    document.getElementById("dupwarn").innerHTML = r.duplicate
      ? '<div class="warn">This invoice was already logged as '+r.duplicate+'. Check before accepting.</div>' : "";
    document.getElementById("slipcard").style.display="block";
    document.getElementById("slipcard").scrollIntoView({behavior:"smooth"});
    document.getElementById("inv").value="";
    document.getElementById("veh").value="";
    document.getElementById("pkg").value="";
    toast(r.grn+" created");
  }).catch(function(e){
    b.disabled=false; b.textContent="Create GRN"; toast("Failed: "+e.message);
  });
}

/* ---- camera ---- */
function toggleCam(){ run ? stopCam() : startCam(); }
function startCam(){
  if(typeof Html5Qrcode==="undefined"){
    document.getElementById("cnote").textContent="Scanner library did not load. Check internet.";
    return;
  }
  qr = qr || new Html5Qrcode("reader");
  qr.start({facingMode:"environment"},{fps:12,qrbox:{width:230,height:230}},
    function(t){ stopCam(); load(t.trim()); }, function(){}
  ).then(function(){
    run=true;
    document.getElementById("cbtn").textContent="Stop camera";
    document.getElementById("cnote").textContent="Point at the GRN code. It reads on its own.";
  }).catch(function(e){
    document.getElementById("cnote").textContent="Camera refused: "+e+
      ". Tap the lock icon in the address bar → Permissions → Camera → Allow, then reload.";
  });
}
function stopCam(){
  if(qr&&run){ qr.stop().then(function(){qr.clear()}).catch(function(){}); }
  run=false;
  var b=document.getElementById("cbtn"); if(b) b.textContent="Start camera";
}
function byHand(){ var v=prompt("GRN number","GRN-2026-"); if(v) load(v.trim()); }

function load(id){
  call({action:"open",grn:id}).then(function(g){
    if(!g || g.error){toast("No gate entry for "+id);return;}
    CUR=g.grn;
    document.getElementById("chead").textContent=g.grn;
    document.getElementById("csub").textContent=
      g.supplier+" · invoice "+g.invoice+" · "+g.packages+" packages";
    document.getElementById("items").innerHTML="";
    addLine(); addLine();
    document.getElementById("cnt").style.display="block";
    document.getElementById("cnt").scrollIntoView({behavior:"smooth"});
    if(g.status==="COUNTED") toast("Warning: this GRN was already counted");
  }).catch(function(e){ toast("Failed: "+e.message); });
}
function addLine(){
  var d=document.createElement("div"); d.className="item";
  d.innerHTML='<div class="nm"><select>'+
    ITEMS.map(function(i){return "<option>"+i+"</option>"}).join("")+
    '</select><small>counted quantity, not invoice quantity</small></div>'+
    '<div class="q"><input inputmode="decimal" placeholder="0"></div>';
  document.getElementById("items").appendChild(d);
}
function saveCount(){
  var lines=[].slice.call(document.querySelectorAll("#items .item")).map(function(d){
    return { item:d.querySelector("select").value,
             qty:parseFloat(d.querySelector("input").value)||0 };
  }).filter(function(l){ return l.qty>0; });
  if(!lines.length){toast("Enter at least one quantity");return;}
  var b=document.getElementById("sbtn"); b.disabled=true; b.textContent="Saving…";
  call({action:"count",grn:CUR,lines:lines,by:"store"}).then(function(r){
    b.disabled=false; b.textContent="Save counted stock";
    document.getElementById("cnt").style.display="none";
    toast(r.msg || "Saved");
  }).catch(function(e){
    b.disabled=false; b.textContent="Save counted stock"; toast("Failed: "+e.message);
  });
}
</script>
</body>
</html>
